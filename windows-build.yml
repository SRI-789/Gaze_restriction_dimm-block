name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        run: windeployqt --qmldir qml --release build/Release/eye-attention-qt.exe

      - name: Package app
        run: Compress-Archive -Path build/Release/* -DestinationPath eye-attention-qt-windows-x64.zip

      - name: Upload app ZIP
        uses: actions/upload-artifact@v4
        with:
          name: eye-attention-qt-windows-x64
          path: eye-attention-qt-windows-x64.zip
          if-no-files-found: error
